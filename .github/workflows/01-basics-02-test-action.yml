name: Test Project
on: 
  push:
    branches:
      - main
    paths:
      - "01-basics/react-basic/**"


jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./01-basics/react-basic

    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test